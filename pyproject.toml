[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphamill"
version = "0.1.0"
description = "以因子假设吞吐量为核心的加密量化研究系统：程序化挖掘 → 统一评测 → 严格留出门 → Freqtrade 执行"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  # 固定到 minor 版本：CI 每次 `pip install -e ".[dev]"` 拉最新，linter 自升级的
  # 默认行为变化曾把 CI 搞红而本地全绿——锁定范围换取可重复性。上界与本地
  # 验证版本保持一致；升级必须是一次显式、本地验证过的改动。
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphamill"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/、conversations/ 下的 .md 文件里大量引用/粘贴的代码片段仅供阅读，不是
# 维护中的源码——用 ruff format 重排它们既无意义，又会破坏文档原样性。
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
