[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphamill"
version = "0.1.0"
description = "以因子假设吞吐量为核心的加密量化研究系统：程序化挖掘 → 统一评测 → 严格留出门 → Freqtrade 执行"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4,<5",
  # F002 数据桥：Parquet 湖（写 PyArrow / 读 DuckDB）。运行时依赖同样锁范围，
  # 是否在范围内由 check_dep_pins 门禁强制（F002 spec 决策表：版本漂移显式改动）。
  "duckdb>=1.5,<2",
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "psycopg2-binary>=2.9,<3",
  "pyarrow>=25,<26",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  # 固定到范围：CI 每次 `pip install -e ".[dev]"` 拉最新，linter 自升级的
  # 默认行为变化曾把 CI 搞红而本地全绿——锁定范围换取可重复性。上界不承诺
  # 等于本地实装版本：round-1 检视（CURRENT-code.md C001）发现本地实跑
  # pytest 9.0.3 而原上界是 <9，注释承诺与事实矛盾，故放宽为 <10 并如实
  # 记录。升级仍必须是一次显式、本地验证过的改动；已装版本是否落在声明
  # 范围内由 verify.py 的 check_dep_pins 步骤强制。
  "pytest>=8,<10",
  # 集成测试顶层 import（F004-Q006）：原先靠 ccxt 传递安装，显式声明并纳入
  # check_dep_pins 范围校验。
  "requests>=2.32,<3",
  "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphamill"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# 让测试可以直接导入门禁工具和 src 布局下的产品包。
pythonpath = [".", "src"]
# 集成测试需要本地服务在线（DB 不可达时跳过），CI 默认跳过，本地全绿为准。
markers = [
  "integration: 需要本地服务（TimescaleDB 等）在线的集成测试",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/、conversations/ 下的 .md 文件里大量引用/粘贴的代码片段仅供阅读，不是
# 维护中的源码——用 ruff format 重排它们既无意义，又会破坏文档原样性。
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# F001 先原样迁移旧仓评测脚本；泛化改造和 lint 收紧属于 F002/M1。
# 这些文件仍须通过 import/运行时验证，不在本阶段重写历史报告生成代码。
[tool.ruff.lint.per-file-ignores]
"src/alphamill/factor_factory/bench/*.py" = ["E501", "B023", "B905"]
"src/alphamill/validation/validate_*.py" = ["E501"]
