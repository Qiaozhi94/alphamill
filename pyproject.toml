[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphamill"
version = "0.1.0"
description = "以因子假设吞吐量为核心的加密量化研究系统：程序化挖掘 → 统一评测 → 严格留出门 → Freqtrade 执行"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4,<5",
  # F002 数据桥：Parquet 湖（写 PyArrow / 读 DuckDB）。运行时依赖同样锁范围，
  # 是否在范围内由 check_dep_pins 门禁强制（F002 spec 决策表：版本漂移显式改动）。
  "duckdb>=1.5,<2",
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "psycopg2-binary>=2.9,<3",
  "pyarrow>=25,<26",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
alphamill-generate = "alphamill.factor_factory.cli:main"

[project.optional-dependencies]
dev = [
  # 固定到范围：CI 每次 `pip install -e ".[dev]"` 拉最新，linter 自升级的
  # 默认行为变化曾把 CI 搞红而本地全绿——锁定范围换取可重复性。上界不承诺
  # 等于本地实装版本：round-1 检视（CURRENT-code.md C001）发现本地实跑
  # pytest 9.0.3 而原上界是 <9，注释承诺与事实矛盾，故放宽为 <10 并如实
  # 记录。升级仍必须是一次显式、本地验证过的改动；已装版本是否落在声明
  # 范围内由 verify.py 的 check_dep_pins 步骤强制。
  "pytest>=8,<10",
  # 集成测试顶层 import（F004-Q006）：原先靠 ccxt 传递安装，显式声明并纳入
  # check_dep_pins 范围校验。
  "requests>=2.32,<3",
  # FastAPI TestClient 的传输层（F009 控制面单元测试顶层 import fastapi.testclient）。
  # fastapi 只在 `standard`/`all` extra 下才带 httpx，本仓装的是裸 fastapi——本地早已
  # 因别的包装着它而全绿，CI 干净环境却在收集期 ImportError（F009 代码检视收口时实测：
  # 两个 Python 版本同时红）。显式声明并纳入 check_dep_pins 范围校验。
  "httpx>=0.28,<1",
  # compose 契约门禁按 YAML 语义取键（F010 R2-002：正则取键会被 flow 写法、`healthcheck:
  # disable`、嵌套键绕过）。本地由别的包传递安装过，但**未声明 = CI 干净环境必红**——
  # 与 httpx 那次（266c9d6）同一个坑，故显式声明并纳入 check_dep_pins。
  "pyyaml>=6,<7",
  "ruff>=0.16,<0.17",
]
mining = [
  # PyTorch 2.7 是已验证下限：官方 2.7 发布说明称其首次支持 Blackwell，
  # 并提供 CUDA 12.8 wheel（https://pytorch.org/blog/pytorch-2-7/）。安装时
  # 必须使用 CUDA 12.8+ wheel 索引。cu128 索引只到 torch 2.11.0（执行机
  # qiaozhi-lt 现用 2.10.0+cu128，见 F003 tasks T029 取证）；若要与 Kronos GPU
  # 镜像同版本（F010：torch 2.14.0），须改用
  # --index-url https://download.pytorch.org/whl/cu130，宿主驱动 R580+（F010 T002 核验）。
  # 本机 torch 2.14.0+cpu 不含 CUDA，不能用于 mining。
  "torch>=2.7,<3",
  "numpy>=2,<3",
  "stable-baselines3>=2.7,<3",
  # vendor 的 RL env 提供 action_masks()，必须用掩码感知算法（MaskablePPO），
  # 否则策略会采样到非法 token 并抛 InvalidExpressionException。
  "sb3-contrib>=2.7,<3",
  "gymnasium>=1.2,<1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphamill"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# 让测试可以直接导入门禁工具和 src 布局下的产品包。
pythonpath = [".", "src"]
# 集成测试需要本地服务在线（DB 不可达时跳过），CI 默认跳过，本地全绿为准。
markers = [
  "integration: 需要本地服务（TimescaleDB 等）在线的集成测试",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/、conversations/ 下的 .md 文件里大量引用/粘贴的代码片段仅供阅读，不是
# 维护中的源码——用 ruff format 重排它们既无意义，又会破坏文档原样性。
extend-exclude = ["*.md", "src/alphamill/factor_factory/generators/alphagen_vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# F001 先原样迁移旧仓评测脚本；泛化改造和 lint 收紧属于 F002/M1。
# 这些文件仍须通过 import/运行时验证，不在本阶段重写历史报告生成代码。
[tool.ruff.lint.per-file-ignores]
"src/alphamill/factor_factory/bench/*.py" = ["E501", "B023", "B905"]
"src/alphamill/validation/validate_*.py" = ["E501"]
