[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphamill"
version = "0.1.0"
description = "以因子假设吞吐量为核心的加密量化研究系统：程序化挖掘 → 统一评测 → 严格留出门 → Freqtrade 执行"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  # 固定到范围：CI 每次 `pip install -e ".[dev]"` 拉最新，linter 自升级的
  # 默认行为变化曾把 CI 搞红而本地全绿——锁定范围换取可重复性。上界不承诺
  # 等于本地实装版本：round-1 检视（CURRENT-code.md C001）发现本地实跑
  # pytest 9.0.3 而原上界是 <9，注释承诺与事实矛盾，故放宽为 <10 并如实
  # 记录。升级仍必须是一次显式、本地验证过的改动；已装版本是否落在声明
  # 范围内由 verify.py 的 check_dep_pins 步骤强制。
  "pytest>=8,<10",
  "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphamill"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# 让测试可以直接 `from tools import ...`（tests/ 无 __init__.py，pytest 不含仓库根）。
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/、conversations/ 下的 .md 文件里大量引用/粘贴的代码片段仅供阅读，不是
# 维护中的源码——用 ruff format 重排它们既无意义，又会破坏文档原样性。
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
