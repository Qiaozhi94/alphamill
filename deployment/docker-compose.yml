services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-quant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-quant}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # 迁移目录整挂到 initdb 的子目录（子目录不会被 entrypoint 直接执行），
      # 由 02_apply_migrations.sh 按序应用并登记 schema_migrations——与既有库的
      # tools/apply_migrations.py 共用同一个版本账本（C402）。
      - ../db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./initdb-apply-migrations.sh:/docker-entrypoint-initdb.d/02_apply_migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quant} -d ${DB_NAME:-quant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [alphamill]

  data-collector:
    build:
      context: ..
      dockerfile: deployment/data-collector.Dockerfile
    container_name: quant-data-collector
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER:-quant}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-quant}
      EXCHANGES: ${EXCHANGES:-binance}
      SYMBOLS: ${SYMBOLS:-BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT,DOGE/USDT}
      TIMEFRAMES: ${TIMEFRAMES:-1m}
      POLL_SECONDS: ${POLL_SECONDS:-30}
      FETCH_LIMIT: ${FETCH_LIMIT:-5}
      BINANCE_HTTPS_PROXY: ${BINANCE_HTTPS_PROXY:-}
    depends_on:
      timescaledb: {condition: service_healthy}
    networks: [alphamill]

  kronos-signal:
    build:
      context: ..
      dockerfile: deployment/kronos-service.Dockerfile
      # 必须显式钉住 mock：无 target 的默认构建会取 Dockerfile 最后一个 stage（real）。
      target: mock
    container_name: quant-kronos-signal
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER:-quant}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-quant}
      # 钉死 false：real 模式由 kronos-signal-real 专属服务提供；保留 .env 覆盖时
      # 误置 true 会让默认服务预检失败并陷入无限重启（F004-C001）。
      KRONOS_USE_REAL_MODEL: "false"
      KRONOS_MODEL: ${KRONOS_MODEL:-models/Kronos-base}
      KRONOS_TOKENIZER: ${KRONOS_TOKENIZER:-models/Kronos-Tokenizer-base}
      KRONOS_DEVICE: ${KRONOS_DEVICE:-cpu}
    depends_on:
      timescaledb: {condition: service_healthy}
    networks: [alphamill]

  # 真实 Kronos 推理实例（F004）：非默认，--profile kronos-real 启用；
  # 启动预检缺资产即失败退出（restart: "no" 保持失败态可见，不退回 mock）。
  kronos-signal-real:
    build:
      context: ..
      dockerfile: deployment/kronos-service.Dockerfile
      target: real
    container_name: quant-kronos-signal-real
    profiles: [kronos-real]
    restart: "no"
    # 控制面能改变生产状态：只在回环与容器网络可达，不发布 0.0.0.0（F009 NFR-003）
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER:-quant}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-quant}
      KRONOS_USE_REAL_MODEL: "true"
      KRONOS_REPO_PATH: /app/vendor/Kronos
      KRONOS_MODEL_PATH: /app/models/Kronos-base
      KRONOS_TOKENIZER_PATH: /app/models/Kronos-Tokenizer-base
      KRONOS_DEVICE: cpu
    volumes:
      - ../vendor/Kronos:/app/vendor/Kronos:ro
      - ../models:/app/models:ro
    # readiness：模型 eager load 完成后 /health 才可达，以 model_loaded=true（且
    # device=cpu）为通过条件（design §5）。
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health')); assert h.get('model_loaded') is True and h.get('device') == 'cpu', h\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 5m
    depends_on:
      timescaledb: {condition: service_healthy}
    networks: [alphamill]

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: quant-freqtrade
    restart: unless-stopped
    ports:
      - "8080:8080"
    command:
      - trade
      - --strategy
      - KronosFusionStrategy
      - --strategy-path
      - /freqtrade/user_data/strategies
    environment:
      PYTHONPATH: /app/src:/freqtrade
      FREQTRADE_API_USERNAME: ${FREQTRADE_API_USERNAME:-admin}
      FREQTRADE_API_PASSWORD: ${FREQTRADE_API_PASSWORD:-change-me-freqtrade-password-32-chars}
      FREQTRADE_JWT_SECRET_KEY: ${FREQTRADE_JWT_SECRET_KEY:-change-me-freqtrade-jwt-secret-32-chars}
      FREQTRADE_WS_TOKEN: ${FREQTRADE_WS_TOKEN:-change-me-freqtrade-ws-token-32-chars}
      BINANCE_HTTPS_PROXY: ${BINANCE_HTTPS_PROXY:-}
      HTTP_PROXY: ${BINANCE_HTTPS_PROXY:-}
      HTTPS_PROXY: ${BINANCE_HTTPS_PROXY:-}
      NO_PROXY: timescaledb,kronos-signal,localhost,127.0.0.1
      KRONOS_SIGNAL_URL: http://kronos-signal:8001
      KRONOS_SIGNAL_EXCHANGE: ${EXCHANGES:-binance}
    volumes:
      - ../freqtrade/user_data:/freqtrade/user_data
      - ../freqtrade/signal_fusion:/freqtrade/signal_fusion:ro
      - ../src:/app/src:ro
      - ./freqtrade-entrypoint.sh:/usr/local/bin/alphamill-freqtrade-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/alphamill-freqtrade-entrypoint.sh"]
    depends_on:
      kronos-signal: {condition: service_started}
    networks: [alphamill]

  grafana:
    image: grafana/grafana:latest
    container_name: quant-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      DB_USER: ${DB_USER:-quant}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-quant}
    volumes:
      - grafana_data:/var/lib/grafana
      - ${GRAFANA_PLUGINS_DIR:-./grafana-plugins}:/var/lib/grafana/plugins
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      timescaledb: {condition: service_healthy}
    networks: [alphamill]

  prometheus:
    image: prom/prometheus:latest
    container_name: quant-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [grafana]
    networks: [alphamill]

volumes:
  timescale_data:
  grafana_data:
  prometheus_data:

networks:
  alphamill:
