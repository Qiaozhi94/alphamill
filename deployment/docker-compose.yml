services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-quant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-quant}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../db/migrations/003_derivatives_market_data.sql:/docker-entrypoint-initdb.d/02_derivatives_market_data.sql:ro
      - ../db/migrations/004_nullable_dryrun_metrics.sql:/docker-entrypoint-initdb.d/03_nullable_dryrun_metrics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quant} -d ${DB_NAME:-quant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [alphamill]

  data-collector:
    build:
      context: ..
      dockerfile: deployment/data-collector.Dockerfile
    container_name: quant-data-collector
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER:-quant}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-quant}
      EXCHANGES: ${EXCHANGES:-binance}
      SYMBOLS: ${SYMBOLS:-BTC/USDT,ETH/USDT}
      TIMEFRAMES: ${TIMEFRAMES:-1m}
      POLL_SECONDS: ${POLL_SECONDS:-30}
      FETCH_LIMIT: ${FETCH_LIMIT:-5}
      BINANCE_HTTPS_PROXY: ${BINANCE_HTTPS_PROXY:-}
    depends_on:
      timescaledb: {condition: service_healthy}
    networks: [alphamill]

  kronos-signal:
    build:
      context: ..
      dockerfile: deployment/kronos-service.Dockerfile
    container_name: quant-kronos-signal
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER:-quant}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-quant}
      KRONOS_USE_REAL_MODEL: ${KRONOS_USE_REAL_MODEL:-false}
      KRONOS_MODEL: ${KRONOS_MODEL:-models/Kronos-base}
      KRONOS_TOKENIZER: ${KRONOS_TOKENIZER:-models/Kronos-Tokenizer-base}
      KRONOS_DEVICE: ${KRONOS_DEVICE:-cpu}
    depends_on:
      timescaledb: {condition: service_healthy}
    networks: [alphamill]

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: quant-freqtrade
    restart: unless-stopped
    ports:
      - "8080:8080"
    command:
      - trade
      - --strategy
      - KronosFusionStrategy
      - --strategy-path
      - /freqtrade/user_data/strategies
    environment:
      PYTHONPATH: /app/src
      FREQTRADE_API_USERNAME: ${FREQTRADE_API_USERNAME:-admin}
      FREQTRADE_API_PASSWORD: ${FREQTRADE_API_PASSWORD:-change-me-freqtrade}
      FREQTRADE_JWT_SECRET_KEY: ${FREQTRADE_JWT_SECRET_KEY:-change-me-freqtrade-jwt}
      FREQTRADE_WS_TOKEN: ${FREQTRADE_WS_TOKEN:-change-me-freqtrade-ws}
      KRONOS_SIGNAL_URL: http://kronos-signal:8001
      KRONOS_SIGNAL_EXCHANGE: ${EXCHANGES:-binance}
    volumes:
      - ../freqtrade/user_data:/freqtrade/user_data
      - ../freqtrade/signal_fusion:/freqtrade/signal_fusion:ro
      - ../src:/app/src:ro
      - ./freqtrade-entrypoint.sh:/usr/local/bin/alphamill-freqtrade-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/alphamill-freqtrade-entrypoint.sh"]
    depends_on:
      kronos-signal: {condition: service_started}
    networks: [alphamill]

  grafana:
    image: grafana/grafana:latest
    container_name: quant-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      DB_USER: ${DB_USER:-quant}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-quant}
    volumes:
      - grafana_data:/var/lib/grafana
      - ${GRAFANA_PLUGINS_DIR:-./grafana-plugins}:/var/lib/grafana/plugins
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      timescaledb: {condition: service_healthy}
    networks: [alphamill]

  prometheus:
    image: prom/prometheus:latest
    container_name: quant-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [grafana]
    networks: [alphamill]

volumes:
  timescale_data:
  grafana_data:
  prometheus_data:

networks:
  alphamill:
