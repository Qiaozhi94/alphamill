# F010 GPU 叠加层：只在执行机显式叠加，把 kronos-signal-real 升级为 CUDA 实例。
#
#   docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.gpu.yml \
#     --profile kronos-real up -d --build kronos-signal-real
#
# GPU 面的唯一配置处（F010 FR-002）：独立镜像标签、CUDA 构建参数、KRONOS_DEVICE、设备预留、
# healthcheck 判据五项同处本文件，不会出现"装了 CUDA wheel 却没申请设备"的半吊子组合。
# 端口/卷/restart/depends_on/profiles/networks 仍由默认文件唯一定义（NFR-003），本文件不覆盖。
# 为什么不用变量开关：compose 插值删不掉设备预留块，count 缺省即"全部 GPU"（F010 R1-001）。
services:
  kronos-signal-real:
    # 与默认 CPU 构建（compose 生成的 <project>-kronos-signal-real）互不覆盖（F010 R2-001）
    image: alphamill/kronos-signal-real:gpu
    build:
      args:
        # 只换索引，不覆盖 TORCH_VERSION：CPU/GPU 同为 2.14.0（2.14.0 无 cu128 包）
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
    environment:
      # 显式设置 → 加载入口走严格分支：拿不到 CUDA 即启动失败，绝不回落 cpu（FR-004）
      KRONOS_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # readiness：model_loaded=true 且 device 以 cuda 开头；报 cpu 的实例不得判就绪（FR-003）
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health')); assert h.get('model_loaded') is True and str(h.get('device')).startswith('cuda'), h\"",
        ]
